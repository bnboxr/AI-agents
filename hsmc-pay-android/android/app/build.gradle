apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    // Intentionally empty — React Native config handled automatically
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

// ─── Release signing (SECURITY) ───────────────────────────────────────
// There is intentionally NO default/sample signing configuration. A release
// APK is only built when the OWNER supplies the real keystore credentials via
// environment variables:
//   HSMC_KEYSTORE_FILE      -> path to the release keystore (default:
//                              android/app/release.keystore)
//   HSMC_KEYSTORE_PASSWORD  -> keystore password
//   HSMC_KEY_ALIAS          -> signing key alias
//   HSMC_KEY_PASSWORD       -> key password
//
// If these are not provided, or the keystore file is missing, the release
// build FAILS with a clear error instead of silently signing with default
// credentials. Debug builds are unaffected.
def releaseStorePassword = System.getenv('HSMC_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('HSMC_KEY_ALIAS')
def releaseKeyPassword = System.getenv('HSMC_KEY_PASSWORD')
def releaseStoreFile = System.getenv('HSMC_KEYSTORE_FILE')
    ? file(System.getenv('HSMC_KEYSTORE_FILE'))
    : file('release.keystore')
def releaseSigningConfigured =
    releaseStorePassword != null && releaseKeyAlias != null && releaseKeyPassword != null

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.hsmcpay"
    defaultConfig {
        applicationId "com.hsmc.pay"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile releaseStoreFile
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

// Fail the release build with a clear error when the owner's real signing
// credentials are unavailable — never sign a release with default/sample
// credentials. Applies only to release tasks; debug builds are unaffected.
tasks.whenTaskAdded { task ->
    if (task.name == 'validateSigningRelease' || task.name == 'packageRelease') {
        task.doFirst {
            if (!releaseSigningConfigured) {
                throw new GradleException(
                    "Release signing is not configured. HSMC Pay does NOT sign releases with " +
                    "default credentials. Set HSMC_KEYSTORE_PASSWORD, HSMC_KEY_ALIAS and " +
                    "HSMC_KEY_PASSWORD (owner's real release keystore) to build a release APK."
                )
            }
            if (!releaseStoreFile.exists()) {
                throw new GradleException(
                    "Release keystore not found at ${releaseStoreFile}. Provide HSMC_KEYSTORE_FILE " +
                    "pointing to the owner's real release keystore."
                )
            }
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
