# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
android.useAndroidX=true
android.enableJetifier=true
newArchEnabled=false
hermesEnabled=true
kotlin.code.style=official
# The React Native Gradle plugin ('com.facebook.react') declares
# `kotlin { jvmToolchain(17) }`. Gradle's toolchain auto-detection looks in
# common-Linux locations (e.g. /usr/lib/jvm/openjdk-17) which on sandbox
# images is an empty directory with no java executable -> build fails with
# "Path for java installation ... does not contain a java executable" and the
# plugin jar is never produced (cascading into "Plugin with id
# 'com.facebook.react' not found"). Point Gradle at the real JDK 17 here.
org.gradle.java.installations.paths=/usr/lib/jvm/java-17-openjdk-amd64
